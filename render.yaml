services:
  - type: web
    name: youcore-motion-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free             # 內部測試先用免費方案（閒置 15 分鐘會休眠）；正式開放改回 starter（$7/月）
    region: singapore      # 亞洲節點，台灣連線較快
    envVars:
      - key: MAX_UPLOAD_MB
        value: "200"
      # 動作分析登入 token 的簽章密鑰（Render 自動產生亂數）
      - key: JWT_SECRET_KEY
        generateValue: true
      # 足部量測 API 驗證 Supabase 登入用（到 Render 後台填值，不要寫進程式碼）
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET   # 只有專案還在用舊制 JWT secret 時才需要
        sync: false
    healthCheckPath: /health
