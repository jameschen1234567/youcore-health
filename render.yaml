services:
  - type: web
    name: youcore-motion-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter          # $7/月，不會睡眠；免費方案會休眠 15 分鐘
    region: singapore      # 亞洲節點，台灣連線較快
    envVars:
      - key: MAX_UPLOAD_MB
        value: "200"
      # 足部量測 API 驗證 Supabase 登入用（到 Render 後台填值，不要寫進程式碼）
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET   # 只有專案還在用舊制 JWT secret 時才需要
        sync: false
    healthCheckPath: /health
